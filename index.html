<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      if (/MicroMessenger/i.test(navigator.userAgent) && location.pathname !== '/wechat' && location.pathname !== '/wechat.html' && !/^\/admin/.test(location.pathname)) {
        location.replace('/wechat' + location.search + location.hash);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="version" content="20260924-responsive" />
  <title>珍珍优质果菜</title>
  <style>
    /* ===== 管理端响应式 + 侧边栏收起 ===== */
    .admin-hamburger {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2000;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #001529;
      color: #fff;
      border: none;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    .admin-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.45);
      z-index: 1500;
    }
    .app-layout.sidebar-collapsed .sidebar {
      width: 0;
      overflow: hidden;
    }
    .app-layout.sidebar-collapsed .sidebar * {
      display: none;
    }
    .admin-toggle-btn {
      position: fixed;
      top: 12px;
      left: 232px;
      z-index: 2000;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #001529;
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: left .2s;
    }
    .app-layout.sidebar-collapsed .admin-toggle-btn {
      left: 12px;
    }
    @media (max-width: 768px) {
      .admin-hamburger {
        display: flex;
      }
      .admin-toggle-btn {
        display: none !important;
      }
      .app-layout .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 1600;
        width: 240px !important;
        transform: translateX(-100%);
        transition: transform .25s ease;
        box-shadow: 2px 0 8px rgba(0,0,0,.2);
      }
      .app-layout.mobile-sidebar-open .sidebar {
        transform: translateX(0);
      }
      .app-layout.mobile-sidebar-open .admin-overlay {
        display: block;
      }
      .main-content {
        padding: 60px 12px 12px !important;
        min-width: 0;
      }
      .page-header {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 10px;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr !important;
        gap: 10px !important;
      }
      .stat-card .value {
        font-size: 22px !important;
      }
      .toolbar {
        flex-wrap: wrap;
      }
      .toolbar input, .toolbar select {
        width: 100% !important;
      }
      table {
        font-size: 12px;
      }
      th, td {
        padding: 8px 6px !important;
      }
      .modal {
        width: 95vw !important;
      }
      .form-inline {
        grid-template-columns: 1fr !important;
      }
      .action-btns {
        flex-wrap: wrap;
      }
    }
  </style>
  <script>
    (function() {
      function initAdminSidebar() {
        if (location.hostname !== 'admin.jennyfresh.com' && !location.pathname.startsWith('/admin')) return;
        if (document.getElementById('admin-hamburger')) return;
        var ham = document.createElement('button');
        ham.id = 'admin-hamburger';
        ham.className = 'admin-hamburger';
        ham.innerHTML = '☰';
        ham.style.display = 'none';
        document.body.appendChild(ham);
        var toggle = document.createElement('button');
        toggle.className = 'admin-toggle-btn';
        toggle.innerHTML = '◀';
        toggle.style.display = 'none';
        document.body.appendChild(toggle);
        var overlay = document.createElement('div');
        overlay.className = 'admin-overlay';
        document.body.appendChild(overlay);
        function refresh() {
          var layout = document.querySelector('.app-layout');
          if (!layout) return;
          if (window.innerWidth <= 768) {
            ham.style.display = 'flex';
            toggle.style.display = 'none';
            layout.classList.remove('sidebar-collapsed');
          } else {
            ham.style.display = 'none';
            toggle.style.display = 'flex';
            layout.classList.remove('mobile-sidebar-open');
          }
        }
        ham.onclick = function() {
          var l = document.querySelector('.app-layout');
          if (l) l.classList.toggle('mobile-sidebar-open');
        };
        overlay.onclick = function() {
          var l = document.querySelector('.app-layout');
          if (l) l.classList.remove('mobile-sidebar-open');
        };
        toggle.onclick = function() {
          var l = document.querySelector('.app-layout');
          if (!l) return;
          l.classList.toggle('sidebar-collapsed');
          toggle.innerHTML = l.classList.contains('sidebar-collapsed') ? '▶' : '◀';
        };
        window.addEventListener('resize', refresh);
        var obs = new MutationObserver(refresh);
        obs.observe(document.body, { childList: true, subtree: true });
        refresh();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAdminSidebar);
      } else {
        initAdminSidebar();
      }
    })();
  </script>
</head>
<body>
  <div id="root"><div id="startup-screen" role="status" style="max-width:420px;margin:80px auto;padding:24px;font:16px/1.7 sans-serif;color:#203b2d">
    <h1 style="font-size:24px">珍珍优质果菜</h1>
    <p id="startup-message">正在打开商城，请稍候…</p>
    <button id="startup-retry" type="button" hidden style="padding:12px 24px;background:#203b2d;color:white;border:0;border-radius:6px;font-size:16px" onclick="location.reload()">重新加载</button>
  </div></div>
  <script>
    (function () {
      window.__showLoadError = function () {
        var message = document.getElementById('startup-message');
        var retry = document.getElementById('startup-retry');
        if (message) message.textContent = '页面未能加载完成。请点击重新加载；如果仍打不开，可在微信右上角选择在浏览器打开，或切换手机流量后重试。';
        if (retry) retry.hidden = false;
      };
      setTimeout(function () {
        if (document.getElementById('startup-screen')) window.__showLoadError();
      }, 15000);
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') window.__showLoadError();
      }, true);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
